name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Run the billing tests
        run: npm test
      - name: Build the Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          npm run dist *> build.log
          $code = $LASTEXITCODE
          Get-Content build.log | Select-Object -Last 60
          if ($code -ne 0) {
            $i = 0
            Get-Content build.log | Select-Object -Last 25 | ForEach-Object { $i++; Write-Host "::error title=build log $i::$($_ -replace '[\r\n%]',' ')" }
            exit $code
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Bin-Saad-Billing-Setup
          path: dist/*.exe
