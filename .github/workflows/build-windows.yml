name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Run the billing tests
        shell: bash
        run: |
          set +e
          npm test > test-out.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^not ok|^\s+error:|^\s+(expected|actual):|^\s+message:|Error" test-out.txt | head -20 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
          fi
          exit $code
      - name: Build the Windows installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Bin-Saad-Billing-Setup
          path: dist/*.exe
      - name: Publish the files as a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${{ github.run_number }}"
          Get-ChildItem dist -Filter *.exe | ForEach-Object { Write-Host $_.Name ($_.Length) }
          gh release create $tag (Get-ChildItem dist -Filter *.exe | ForEach-Object { $_.FullName }) --title "Bin Saad Billing $tag" --notes "Setup installer and portable version. Run the Setup file to install, or the portable file to run without installing." --latest
